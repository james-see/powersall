[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powersall"
version = "2.0.4"
description = "Advanced Powerball lottery analysis and number generator tool"
authors = [
    {name = "James Campbell", email = "james@jamescampbell.us"},
]
maintainers = [
    {name = "James Campbell", email = "james@jamescampbell.us"},
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["powerball", "lottery", "random-numbers", "lotto", "megamillions", "analysis"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "lxml>=4.9.0",
    "markovify>=0.9.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "plotly>=5.17.0",
    "streamlit>=1.28.0",
]

[project.urls]
Homepage = "https://github.com/james-see/powersall"
Repository = "https://github.com/james-see/powersall"
Documentation = "https://james-see.github.io/powersall"

[project.scripts]
powersall = "powersall.powersall:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["powersall*"]

[tool.coverage.run]
branch = true
source = ["powersall"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=powersall --cov-report=term-missing"
testpaths = ["tests"]
